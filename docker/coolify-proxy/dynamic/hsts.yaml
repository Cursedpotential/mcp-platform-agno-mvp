# HSTS middleware for the Coolify control-plane Traefik (IONOS box).
#
# Byline: Claude Code . Opus 5 (1M) . 2026-08-02
#
# DEPLOY TARGET
#   host  : ionos-ts (100.98.98.38)  ->  /data/coolify/proxy/dynamic/hsts.yaml
#   inside: coolify-proxy container  ->  /traefik/dynamic/hsts.yaml
#   Deploy with scripts/deploy_coolify_hsts.sh (never hand-edit on the box).
#
# WHY A SEPARATE FILE
#   /traefik/dynamic/coolify.yaml is AUTO-GENERATED by Coolify and says so:
#   "Do not edit it manually". Coolify owns only that filename, so a separate
#   file survives its regeneration. Traefik runs with
#   --providers.file.directory=/traefik/dynamic/ --providers.file.watch=true,
#   so dropping this in is hot-reloaded: no proxy restart, and removing the
#   file is a complete rollback.
#
# WHY ENTRYPOINT-ATTACHED, NOT ROUTER-ATTACHED
#   A middleware only applies to routers that name it, and Coolify's routers
#   are in the file we must not edit. The alternative -- duplicating Coolify's
#   routers here at a higher priority -- would have to out-prioritise
#   coolify-https while still LOSING to the longer PathPrefix rules for /app
#   (realtime websocket) and /terminal/ws. Traefik's default priority is rule
#   length, so that balance is implicit arithmetic that breaks silently and
#   takes the websockets with it. Attaching at the entrypoint instead applies
#   to every HTTPS router automatically, including those two.
#   Wired via, in /traefik/docker-compose.yml command args:
#       --entrypoints.https.http.middlewares=hsts@file
#
# WHY max-age STARTS SHORT
#   HSTS is sticky in the browser and CANNOT be withdrawn server-side -- once a
#   client has cached it, clearing it is a per-user manual step. So it ships at
#   300s to prove the header is live, then gets raised. stsPreload stays false
#   permanently: preload submission is effectively irreversible.
#
# CONTEXT: this exists because port 8000 serves the same dashboard over plain
# HTTP and sets coolify_session WITHOUT the secure flag. Cookies are not
# isolated by port, so that non-secure cookie is also sent to the HTTPS site,
# collides with the secure one, and every HTTPS POST returns 419 Page Expired.
# HSTS stops the browser making the insecure hop at all. It does NOT close port
# 8000 -- that is still open to the internet and needs a firewall fix.

http:
  middlewares:
    hsts:
      headers:
        stsSeconds: 300
        stsIncludeSubdomains: false
        stsPreload: false
