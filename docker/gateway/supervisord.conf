[program:litellm]
command=litellm --config /etc/litellm/config.yaml --port 4000 --host 0.0.0.0
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:opencode]
command=opencode serve --hostname 0.0.0.0 --port 4096
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
