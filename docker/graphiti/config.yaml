# Graphiti MCP server config (ADR-0014) — Neo4j backend, LiteLLM gateway models.
# Mounted over the image default; selected via CONFIG_PATH.
server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "openai"
  model: "glm-5.1"           # PRIMARY via gateway -> Ollama Cloud (2026-06-11)
  max_tokens: 4096
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:http://gateway:4000/v1}

embedder:
  provider: "openai"
  model: "embed-text"        # nvidia llama-nemotron-embed via gateway
  dimensions: 2048
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:http://gateway:4000/v1}

database:
  provider: "neo4j"
  providers:
    neo4j:
      uri: ${NEO4J_URI:bolt://neo4j:7687}
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD}
      database: ${NEO4J_DATABASE:neo4j}

graphiti:
  group_id: "platform"
