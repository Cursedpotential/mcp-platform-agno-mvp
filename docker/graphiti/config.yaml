# Graphiti MCP server config (ADR-0014) — Neo4j backend, LiteLLM gateway models.
# Mounted over the image default; selected via CONFIG_PATH.
# Byline: Claude Code · Fable 5 · 2026-07-04 (LLM glm-5.1 → nemotron: schema-conformant JSON required)
server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "openai"
  model: "nemotron"          # NIM guided-json; glm-5.1 cannot emit schema-conformant
                             # structured output -> every add_memory failed (fixed 2026-07-04)
  max_tokens: 4096
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:http://gateway:4000/v1}

embedder:
  provider: "openai"
  model: "embed-text"        # nvidia nv-embed-v1 via gateway (symmetric, 2026-07-04)
  dimensions: 4096
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:http://gateway:4000/v1}

database:
  provider: "neo4j"
  providers:
    neo4j:
      uri: ${NEO4J_URI:bolt://neo4j:7687}
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD}
      database: ${NEO4J_DATABASE:neo4j}

graphiti:
  group_id: "platform"
