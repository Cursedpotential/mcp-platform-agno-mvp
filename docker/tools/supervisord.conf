[program:sbv]
command=/opt/sbv/sbv
directory=/opt/sbv
# SBV listens on 8085 (its default) and uses CWD-relative ./data — the
# compose volume mounts at /opt/sbv/data and publishes host 8080 -> 8085.
environment=LD_LIBRARY_PATH="/opt/sbv-libs"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tools-facade]
command=python -m uvicorn facade:app --host 0.0.0.0 --port 8090
directory=/opt/tools
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
