# =============================================================================
# KNOWLEDGE WORKBENCH — deploy as its OWN Coolify app on OVH-1 ("ovh-app",
# tailnet 100.72.169.40). Single-service app per the one-concern-per-app rule
# (see compose.data-vector.yaml for the pattern precedent).
#
# Coolify Watch Paths for this app: workbench/** + deploy/workbench.yaml
# Branch: workbench/sprint (sprint), main after milestone merges.
#
# HOST-PREP (once, before first deploy):
#   sudo mkdir -p /data/agno/volumes/workbench/{lancedb,inbox,copilot}
#   sudo chown -R 1000:1000 /data/agno/volumes/workbench
#   docker network inspect agno >/dev/null 2>&1 || docker network create agno
#
# C2.5 (Ops Copilot) note: OPENCODE_URL points at the exec-gateway app's
# published :4096 (same box, same tailnet IP as AGENTOS_API_URL below — see
# compose.gateway.yaml for the OpenCode server + its own C2.5 fixes: the
# /workspace bind mount + OPENCODE_SERVER_USERNAME/PASSWORD Basic auth).
# Deploy order: redeploy exec-gateway with those fixes FIRST (or together),
# THEN this app — OPENCODE_PASSWORD here should match OPENCODE_SERVER_PASSWORD
# there once the owner sets it (never committed in either place).
#
# The workbench stages uploads locally (LanceDB whole-file store) and promotes
# them through the EXISTING ingestion spine (agentos-api). It never writes
# Milvus/Postgres directly. agentos-api is reached via the tailnet-published
# port (cross-app docker DNS does NOT resolve — agentos-api is on an
# app-scoped network, not the shared `agno` net).
#
# Object storage is S3-agnostic: point OBJECT_STORE_* at R2 today; a B2 (or
# any S3) target is a pure env swap + redeploy. Nothing provider-specific.
#
# Coolify gotcha: env values are rendered as literals into the materialized
# compose at deploy — set ALL envs (bulk API, {"data":[...]} shape) BEFORE the
# first deploy; later env changes require a redeploy.
# =============================================================================
# Byline: Claude Code · Fable 5 · 2026-07-19 (MCP_SERVERS/CONTEXTFORGE_TOKEN added 2026-07-20, C1 rebuild; OPENCODE_*/COPILOT_PRESETS_PATH + copilot bind mount added 2026-07-21, C2.5; agno 2.8 MCP door migration (:8001->:8000 + token_env) + GRAPHITI_MCP_URL added 2026-07-23, Claude Code · Sonnet (agent), C4; Coolify path/watch-path true-up 2026-08-13, Codex · GPT-5; Graphiti host repoint + model-lab Portkey env 2026-08-16, Codex · GPT-5)

services:
  knowledge-workbench:
    build:
      context: ./workbench
      dockerfile: Dockerfile
    image: agno-knowledge-workbench:latest
    container_name: knowledge-workbench
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:8020:8020"   # tailnet-only; NEVER 0.0.0.0
    environment:
      APP_PORT: "8020"
      # Mandatory inbound boundary for the static UI, API, and API docs.
      # Set a long random secret in Coolify before deploy; empty fails closed
      # everywhere except the exact /health orchestration probe. Browsers use
      # Basic owner:<secret>; API clients may send Bearer <secret>.
      WORKBENCH_API_KEY: ${WORKBENCH_API_KEY:-}
      LANCEDB_PATH: /data/lancedb
      AGENTOS_API_URL: ${AGENTOS_API_URL:-http://100.72.169.40:8000}
      # Bearer for both /knowledge/* (legacy promote) and /v1/runs (C1
      # console) — base_app's OS_SECURITY_KEY gate applies to every route
      # regardless of authorization=False (see AGENTS.md Claude-Reflect note).
      AGENTOS_API_TOKEN: ${AGENTOS_API_TOKEN:-}
      # --- MCP tool servers (Tool Explorer, C1 console) ---
      # agno 2.8 door migration (2026-07-23): agentos-mcp :8001 is RETIRED —
      # the "agentos" entry's url now points at agentos-api's own mounted
      # /mcp door (streamable-HTTP, :8000) and carries "token_env":
      # "AGENTOS_API_TOKEN" so the Tool Explorer sends
      # Authorization: Bearer <OS_SECURITY_KEY> (that env var is already set
      # below — nothing new to provision). ContextForge needs a real path
      # (per-virtual-server, not the bare gateway root) + a minted JWT once
      # one exists — see workbench/api/app/config/settings.py's
      # mcp_servers_parsed docstring and
      # docs/planning/architecture-directives/contextforge-integration.md.
      # Set as a LITERAL, not `${MCP_SERVERS:-<json>}`: Docker Compose's
      # interpolation has no brace-nesting awareness, so a JSON default
      # containing `}` would truncate at the JSON's own first `}`. This is
      # also just this repo's existing Coolify convention anyway (env
      # values are rendered as literals at deploy — see the file header) —
      # to override, edit this value directly in the Coolify env editor.
      # agentos url uses :8000/mcp (agentos-api's mounted MCP surface) — the
      # standalone agentos-mcp service (:8001) was retired 2026-07-23, its
      # mounted-/mcp bug fixed upstream in agno 2.8.0.
      MCP_SERVERS: '[{"key":"agentos","label":"AgentOS","url":"http://100.72.169.40:8000/mcp","token_env":"AGENTOS_API_TOKEN"},{"key":"contextforge","label":"ContextForge","url":"http://100.72.169.40:4444/mcp","token_env":"CONTEXTFORGE_TOKEN"}]'
      CONTEXTFORGE_TOKEN: ${CONTEXTFORGE_TOKEN:-}
      # --- LLM gateway (default model-lab route) ---
      # Self-hosted Portkey accepts the selected upstream in
      # x-portkey-provider and the corresponding upstream credential as the
      # bearer token. The Workbench never exposes either value to the browser.
      # A future Portkey control-plane key can omit PORTKEY_PROVIDER and use
      # the same variables for the integrated cloud Model Catalog instead.
      PORTKEY_BASE_URL: ${PORTKEY_BASE_URL:-http://100.72.169.40:8787/v1}
      PORTKEY_PROVIDER: ${PORTKEY_PROVIDER:-}
      PORTKEY_API_KEY: ${PORTKEY_API_KEY:-}
      PORTKEY_MODEL_ID: ${PORTKEY_MODEL_ID:-gpt-4o}
      # --- Graphiti knowledge-graph memory (C4 Graph memory pane) ---
      # Tailnet "graphiti-hostfix" nginx sidecar (compose.data-graphiti.yaml)
      # — read-only search/episodes only, no auth (tailnet-only).
      GRAPHITI_MCP_URL: ${GRAPHITI_MCP_URL:-http://100.91.190.107:8071/mcp}
      # --- Ops Copilot (C2.5) — headless OpenCode server, exec-gateway app ---
      OPENCODE_URL: ${OPENCODE_URL:-http://100.72.169.40:4096}
      OPENCODE_USERNAME: ${OPENCODE_USERNAME:-opencode}
      # Empty = no Authorization header sent (matches the OpenCode server's
      # pre-redeploy unauthenticated state) — see compose.gateway.yaml's
      # C2.5 fix #2 and app/repo/opencode_client.py. Set to the SAME value
      # as exec-gateway's OPENCODE_SERVER_PASSWORD once the owner sets it.
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-groq/llama-3.3-70b-versatile}
      OPENCODE_WORKSPACE_DIR: ${OPENCODE_WORKSPACE_DIR:-/workspace/copilot}
      COPILOT_PRESETS_PATH: ${COPILOT_PRESETS_PATH:-/data/copilot/presets.json}
      # --- S3-agnostic object store (R2 now; B2/any-S3 = swap these envs) ---
      OBJECT_STORE_ENDPOINT_URL: ${R2_ENDPOINT_URL}
      OBJECT_STORE_BUCKET: ${R2_BUCKET_NAME}
      OBJECT_STORE_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-auto}
      OBJECT_STORE_PREFIX: ${OBJECT_STORE_PREFIX:-workbench/staging}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    volumes:
      # Bind mounts only — owner backs up host dirs (no named volumes).
      - /data/agno/volumes/workbench/lancedb:/data/lancedb
      - /data/agno/volumes/workbench/inbox:/data/inbox
      # C2.5 Ops Copilot preset-prompt override (optional — see
      # app/service/copilot_presets.py; absent file = in-code defaults only).
      - /data/agno/volumes/workbench/copilot:/data/copilot
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - workbench
      - agno
    # --- DOMAIN PHASE (scaffolded, COMMENTED — tailnet-only until DNS fixed) ---
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.workbench.rule=Host(`workbench.int.mitechconsult.com`)
    #   - traefik.http.routers.workbench.entrypoints=websecure
    #   - traefik.http.routers.workbench.tls.certresolver=letsencrypt
    #   - traefik.http.services.workbench.loadbalancer.server.port=8020
    #   - traefik.http.routers.workbench.middlewares=workbench-auth
    #   - traefik.http.middlewares.workbench-auth.basicauth.users=<apr1-hash-here>

networks:
  workbench:
  agno:
    external: true   # shared cross-app net; declared for future DNS, not depended on
