# =============================================================================
# Byline: Claude Code · Kimi K3 (drift-fix) · 2026-08-12 — Milvus env block
#         annotated superseded/down (ADR-0040, D-042, data-vector off since 2026-08-10).
# Byline: Codex · GPT-5 · 2026-08-13 — restore the live AgentOS Traefik
#         route lost during compose consolidation; auth remains OS_SECURITY_KEY.
# Byline: Codex · GPT-5 · 2026-08-18 — native-evidence blue/green activation
#         inputs; secrets remain Coolify-managed and are never committed.
# Byline: Codex · GPT-5.6 · 2026-08-29 — persistent, fail-closed upload
#         staging for restart-safe framework-neutral ingest recovery.
# =============================================================================
# EXEC TIER (RUMP) — deploy on OVH-1 ("ovh1-agno"; tailnet 100.72.169.40, salem
# private 10.1.1.122, public 40.160.5.19), the execution + surfaces box.
# Coolify "Docker Compose" app (rz41wqhpjfh1rj796ixvjhfs) built from this repo.
#
# 2026-07-19 SPLIT (owner order: "separate anything that can be separated"):
# gateway, sandbox, platform-tools, desktop, and contextforge were split out
# into their own one-service-per-app Coolify apps (compose.gateway.yaml,
# compose.sandbox.yaml, compose.platform-tools.yaml, compose.desktop.yaml,
# compose.contextforge.yaml — see exec-tier-split-result.md for the full
# before/after). agent-ui was REMOVED (not split) — the standalone `agent-ui`
# Coolify app (ee2vevjrutfzxlytlu081frh) already served chat.mitechconsult.com
# and was functionally redundant with this bundle's tailnet-only copy.
#
# This file now holds ONLY agentos-api + agentos-mcp — legitimately coupled
# (same image, one build) and left together per owner's explicit call.
# They reach contextforge/platform-tools over the shared external `agno`
# docker network (same docker-DNS names as before the split: `contextforge`,
# `platform-tools` — CF_GATEWAY_URL / SBV_BASE_URL values are UNCHANGED).
# =============================================================================
# Mirrors the proven milvus-coolify pattern:
#   * ports bind to ${BIND_IP} (the box's TAILNET IP) — NOT 0.0.0.0. Set
#     BIND_IP=100.72.169.40 in the Coolify app env (OVH-1 tailnet IP).
#
# Cross-box wiring: at the moment everything communicates through Tailscale, so
# cross-box addresses DEFAULT to the tailnet IP, with the salem private IP
# documented as the swap-later fast path. Set via env so switching is trivial:
#   OVH1_HOST   this exec box. Default 100.72.169.40 (tailnet); salem alt 10.1.1.122.
#   OVH3_HOST   data box (db + neo4j + graphiti + milvus + surrealdb).
#               Default 100.119.96.29 (tailnet); salem alt 10.1.2.101.
# plus DB_*, MILVUS_*, SURREALDB_*, CF_*, R2_*, OPENROUTER_API_KEY.
#
# Coolify watch paths REQUIRED for this app:
#   deploy/exec.yaml
#   Dockerfile
#   server/**
# The live app must be corrected from the retired compose.exec.yaml path before
# this source change can be considered deployed.
#
# HOST-PREP on OVH-1 BEFORE first deploy (the repo image currently runs as
# root, so the staging directory is deliberately root-only):
#   sudo mkdir -p /data/agno/volumes/{sbv_data,agent_workspace,kasm_profile,contextforge}
#   sudo install -d -m 0700 -o root -g root /data/agno/volumes/ingest-staging
#   sudo chown -R 1000:1000 /data/agno/volumes/agent_workspace  # shared sandbox<->desktop
#   sudo chown -R 1000:1000 /data/agno/volumes/contextforge     # ContextForge SQLite db + state
# (r2-nexus stays a named volume — it uses the rclone driver, not a bind.)
# `docker network create agno` on OVH-1 if not already present (shared
# cross-app network — created 2026-07-19 for this split, mirrors OVH-3's
# `agno` net from the data-tier split, commit 18c42d2).
# =============================================================================

services:
  agentos-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentos-api
    image: ${IMAGE_NAME:-agentos}:${IMAGE_TAG:-latest}
    # Prod: run the baked image (no live .:/app source mount). Redeploy to ship
    # code changes. NO --reload (breaks the MCP lifespan under AgentOS).
    command: uvicorn server.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:8000:8000"   # main API/MCP surface — proxy-ready below
    volumes:
      # R2 bucket "nexus" via rclone docker volume plugin — stack-wide blob store.
      - r2-nexus:/r2
      # Ingest surfaces (owner order 2026-08-24): the sorted evidence bucket
      # (read-only) + a host drop-dir, so data can be moved into the system and
      # workflows triggered without any copy step. Mirrors the temporal-worker
      # mounts on ovh-files (/data/ingest + /data/r2-sorted there).
      - r2-casebible-sorted:/data/r2-sorted:ro
      - /srv/ingest:/data/ingest
      # API-upload staging is distinct from the operator drop-dir above. Long
      # bind syntax prevents Compose from silently creating an unprotected
      # replacement directory when the required host-prep step was missed.
      - type: bind
        source: /data/agno/volumes/ingest-staging
        target: /data/ingest-staging
        bind:
          create_host_path: false
    env_file:
      - path: .env
        required: false
    environment:
      RUNTIME_ENV: ${RUNTIME_ENV:-dev}
      AGNO_DEBUG: "True"
      WAIT_FOR_DB: "True"
      AGENTOS_URL: http://127.0.0.1:8000
      # Durable source bytes used by restart recovery. This is intentionally a
      # literal mounted path: no container-local /tmp or env fallback is valid
      # in the production manifest.
      INGEST_STAGING_ROOT: /data/ingest-staging
      # Data tier WAS all on OVH-3; PG moved to ovh-files 2026-08-02 (app
      # data-pg-files, BIND_IP 100.91.190.107) as wave 1 of the ovh-data
      # retirement. PG_HOST overrides just the Postgres hop; services still on
      # OVH-3 keep riding ${OVH3_HOST} (100.119.96.29; salem alt 10.1.2.101).
      DB_HOST: ${PG_HOST:-${OVH3_HOST}}
      DB_PORT: 5432
      DB_USER: ${DB_USER:-ai}
      DB_PASS: ${DB_PASS:-ai}
      DB_DATABASE: ${DB_DATABASE:-platform}
      # Milvus (ADR-0026/0027) — vector store on OVH-3; defaults to the data box's
      # gRPC port over the tailnet. Override MILVUS_ADDRESS/TOKEN in env if needed.
      # NB 2026-08-12: ADR-0026/0027 SUPERSEDED by ADR-0040 (Weaviate locked
      # 2026-07-27). Milvus is not merely sidelined — the `data-vector` app is
      # DOWN deliberately since 2026-08-10 (6th embedded-etcd corruption;
      # docs/COORDINATION.md), and pymilvus was removed from the image
      # 2026-08-09 (D-042). These vars are legacy/vestigial; nothing live.
      MILVUS_ADDRESS: ${MILVUS_ADDRESS:-http://${OVH3_HOST}:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      # SurrealDB on OVH-3 — WS transport, /rpc path. ~~Agno operational
      # store~~ → PARKED read-only since the 2026-08-04 flatten (ADR-0043
      # decision 3); the operational store is Postgres now. These vars are
      # retained ONLY to feed get_surrealdb_legacy() for a read-only parity
      # check — no runtime path uses them. Do not delete (owner-gated).
      SURREALDB_URL: ${SURREALDB_URL:-ws://${OVH3_HOST}:8000/rpc}
      SURREALDB_USER: ${SURREALDB_USER:-root}
      SURREALDB_PASS: ${SURREALDB_PASS:-root}
      SURREALDB_NS: ${SURREALDB_NS:-agno}
      SURREALDB_DB: ${SURREALDB_DB:-platform}
      # Reach MCP servers ONLY through ContextForge, never graphiti's 8071 directly.
      # `contextforge` now resolves via the shared `agno` network (its own split
      # app, compose.contextforge.yaml) — value UNCHANGED from before the split.
      CF_GATEWAY_URL: http://contextforge:4444
      CF_GRAPHITI_SERVER_ID: ${CF_GRAPHITI_SERVER_ID:-} # virtual server UUID from POST /servers
      CF_GATEWAY_TOKEN: ${CF_GATEWAY_TOKEN:-}           # long-lived client JWT (mint w/ create_jwt_token)
      # Knowledge embedder via OpenRouter symmetric models (ADR-0027).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Native evidence vectors are an explicit, fail-closed cutover. The blue
      # Weaviate app publishes REST 8082 / gRPC 50052 side by side with the old
      # instance. Coolify must supply the target host and both security keys;
      # no secret or production host is baked into this manifest.
      NATIVE_EVIDENCE_ENABLED: ${NATIVE_EVIDENCE_ENABLED:?set true only after native evidence canaries pass}
      WEAVIATE_HTTP_HOST: ${WEAVIATE_HTTP_HOST:?set the blue Weaviate host in Coolify}
      WEAVIATE_HTTP_PORT: ${WEAVIATE_HTTP_PORT:-8082}
      WEAVIATE_GRPC_PORT: ${WEAVIATE_GRPC_PORT:-50052}
      WALK_PASS_SIGNING_KEY: ${WALK_PASS_SIGNING_KEY:?set WALK_PASS_SIGNING_KEY in Coolify app env}
      EVIDENCE_OPERATOR_SECURITY_KEY: ${EVIDENCE_OPERATOR_SECURITY_KEY:?set EVIDENCE_OPERATOR_SECURITY_KEY in Coolify app env}
      # Temporary owner-testing bootstrap. Disabled by default. When enabled,
      # the API accepts X-Real-IP only from the exact Traefik socket peer and
      # only for configured subnets inside Tailscale CGNAT (100.64.0.0/10).
      AGENTOS_TAILNET_AUTH_BYPASS_ENABLED: ${AGENTOS_TAILNET_AUTH_BYPASS_ENABLED:-false}
      AGENTOS_TAILNET_AUTH_TRUSTED_PROXY_CIDRS: ${TRAEFIK_PROXY_CIDR:-}
      AGENTOS_TAILNET_AUTH_ALLOWED_CIDRS: ${AGENTOS_TAILNET_AUTH_ALLOWED_CIDRS:-100.64.0.0/10}
      # R2 blob landing zone (ADR-0007) — S3-compatible reads via boto3/agno.
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      # SBV toolkit (facade-collapse plan Batch A, §2.3) — server/agents/tools/
      # sbv_tools.py talks to SBV directly over the shared `agno` network
      # (platform-tools:8085, now its own split app, compose.platform-tools.yaml),
      # not through the tools-facade proxy. Value UNCHANGED from before the split.
      SBV_BASE_URL: ${SBV_BASE_URL:-http://platform-tools:8085}
      SBV_SERVICE_USER: ${SBV_SERVICE_USER:-mcp_service}
      # SBV_PRIMARY_ENABLED removed 2026-08-10 (owner call): dead knob. The
      # 2026-08-02 demotion was LIFTED by PR #18 (aacf21c) -> SBV is PRIMARY again
      # (DECISION_LOG D-040). _sbv_enabled() gates solely on SBV_SERVICE_PASS, and
      # tests/test_sbv_demotion.py pins that this var gates nothing. Setting it in
      # any env is now a no-op and safe to delete from the Coolify app env too.
      SBV_SERVICE_PASS: ${SBV_SERVICE_PASS:?set SBV_SERVICE_PASS in Coolify app env}
    # No depends_on agentos-db — it's on another box. WAIT_FOR_DB handles startup.
    # Public AgentOS surface. Authentication is enforced by AgentOS's
    # OS_SECURITY_KEY bearer middleware; Traefik terminates TLS and routes only.
    labels:
      - traefik.enable=true
      - traefik.docker.network=rz41wqhpjfh1rj796ixvjhfs
      - traefik.http.routers.agentos-api.rule=Host(`agentos.mitechconsult.com`)
      - traefik.http.routers.agentos-api.entryPoints=https
      - traefik.http.routers.agentos-api.tls=true
      - traefik.http.routers.agentos-api.tls.certresolver=letsencrypt
      - traefik.http.routers.agentos-api.service=agentos-api
      - traefik.http.services.agentos-api.loadbalancer.server.port=8000
    networks:
      - agentos
      - agno   # cross-app docker-DNS to contextforge / platform-tools (2026-07-19 split)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # agentos-mcp RETIRED 2026-07-23 (owner decision). It existed only to work
  # around agno's mounted /mcp sub-app not surviving uvicorn (StreamableHTTP
  # session-manager task group didn't init when mounted) — fixed upstream in
  # agno 2.8.0 (verified: agentos-api's mounted :8000/mcp now does a clean
  # initialize + tools/list round-trip). The workaround (server/api/mcp_main.py,
  # kept and marked DEPRECATED, not deleted) and this service block are no
  # longer needed; all MCP traffic now goes to agentos-api's mounted /mcp on
  # :8000. See docs/adr/ and C:\Users\matts\OneDrive\AI Space\agno-upgrade-result.md
  # ("agentos-mcp retirement" section) for the full verification trail.
  # ---------------------------------------------------------------------------

networks:
  agentos:
  agno:
    external: true   # shared cross-app network on OVH-1 (created 2026-07-19 split)

volumes:
  # Cloudflare R2 bucket "nexus" via the rclone volume plugin (host config:
  # /var/lib/docker-plugins/rclone/config/rclone.conf). Not a bind mount.
  r2-nexus:
    driver: rclone
    driver_opts:
      remote: "r2:nexus"
      allow_other: "true"
      vfs_cache_mode: "writes"
  # Sorted evidence corpus (canonical vault copy) — READ-ONLY ingest source
  # (owner order 2026-08-24). Same rclone plugin + host config as r2-nexus.
  r2-casebible-sorted:
    driver: rclone
    driver_opts:
      remote: "r2:casebible-sorted"
      allow_other: "true"
      vfs_cache_mode: "minimal"

