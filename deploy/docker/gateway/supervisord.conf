# Byline: Claude Code · Fable 5 · 2026-07-29 (litellm disabled, ADR-0042)
#
# LiteLLM is RETIRED as the model gateway (ADR-0042 — Portkey took the role on
# 2026-07-19). Owner ruling 2026-07-29: "don't tear out litellm, just completely
# disable it, but leave it in the build for now." So the binary and its config
# stay baked into the image (docker/gateway/Dockerfile still pip-installs it and
# COPYs litellm-config.yaml) — only the process is prevented from starting.
#
# TO RE-ENABLE (rollback): set autostart=true below and redeploy exec-gateway.
# Nothing else is required; the config file is still present at /etc/litellm/config.yaml.
# TO REMOVE FOR REAL (later): drop this program block, the pip install, and the
# COPY line in the Dockerfile, and unpublish :4000 in compose.gateway.yaml.
[program:litellm]
command=litellm --config /etc/litellm/config.yaml --port 4000 --host 0.0.0.0
autostart=false
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:opencode]
command=opencode serve --hostname 0.0.0.0 --port 4096
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
