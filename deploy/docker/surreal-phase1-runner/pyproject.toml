[project]
name = "horizon-surreal-phase1-runner"
version = "0.1.0"
description = "Isolated synthetic-only SurrealDB Phase-1 evaluation runner"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyjwt[crypto]==2.10.1",
  "surrealdb==2.0.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horizon_surreal_phase1"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

