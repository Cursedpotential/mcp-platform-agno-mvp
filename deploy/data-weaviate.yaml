# data-weaviate — platform vector substrate (ADR-0040, accepted 2026-07-27)
# Byline: Claude Code · Fable 5 · 2026-07-27
# Tailnet-internal on ovh-data. Anonymous access matches current data-tier posture
# (tailnet-only exposure); API-key hardening tracked in OPEN-TASKS.
# TODO: pin image tag after first successful pull.
services:
  weaviate:
    image: semitechnologies/weaviate:latest
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8080:8080"   # REST/GraphQL
      - "50051:50051" # gRPC
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none   # embeddings are supplied by the platform (nv-embed-v1 4096-d)
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
      DISK_USE_READONLY_PERCENTAGE: "95"
    volumes:
      - weaviate-data:/var/lib/weaviate
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  weaviate-data:
