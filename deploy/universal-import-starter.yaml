# Universal Import Starter — separate Coolify application on ovh-files.
# Watch paths — see deploy/WATCH-PATHS.md for the exact value to paste into
# Coolify. As of the vendored-build repair (2026-09-02):
#   modules/engine/**, deploy/docker/universal-import-starter/**,
#   deploy/universal-import-starter.yaml
# The upload ingress and worker share this host-backed source-object root.
# Prepare it with ownership 10001:10001 and mode 0750 before deployment.
# Byline: Codex · GPT-5.6-Sol · 2026-08-30 (durable preview and source-context API)
# Byline: Codex · GPT-5.6-Terra · 2026-08-30 (rotatable n8n runtime-file auth)
# Byline: Claude Code · Sonnet 5 · 2026-09-02 (BUILD LANE D1: hermetic vendored
# build post-restructure — build context set to repo root so
# deploy/docker/universal-import-starter/Dockerfile's `COPY modules/engine/`
# resolves; dockerfile path made explicit and repo-root-relative)

services:
  universal-import-starter:
    build:
      context: .
      dockerfile: deploy/docker/universal-import-starter/Dockerfile
    image: ${UNIVERSAL_IMPORT_STARTER_IMAGE:-platform-universal-import-starter:latest}
    restart: unless-stopped
    # Host networking preserves the actual Tailscale socket peer. Docker's
    # published-port DNAT rewrites it to a bridge address and defeats the
    # direct-peer authorization check.
    network_mode: host
    environment:
      PLATFORM_DATABASE_URL_FILE: /run/secrets/platform-database-url
      TEMPORAL_HOST_PORT: ${TEMPORAL_HOST_PORT:?set}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-universal-import-v1}
      REFERENCE_STARTER_ADDR: 100.91.190.107:8091
      REFERENCE_STARTER_HEALTH_URL: http://100.91.190.107:8091/healthz
      SOURCE_OBJECT_DIR: /data/uiw/source-objects
      UNIVERSAL_IMPORT_UPLOAD_MAX_BYTES: ${UNIVERSAL_IMPORT_UPLOAD_MAX_BYTES:?set}
      N8N_UNIVERSAL_IMPORT_BASE_URL: ${N8N_UNIVERSAL_IMPORT_BASE_URL:?set}
      N8N_UNIVERSAL_IMPORT_AUTH_HEADER: ${N8N_UNIVERSAL_IMPORT_AUTH_HEADER:?set}
      N8N_UNIVERSAL_IMPORT_AUTH_VALUE_FILE: /run/secrets/n8n-universal-import-auth
      UIW_PREVIEW_CURSOR_KEY_FILE: /run/secrets/uiw-preview-cursor-key
      UIW_SERVICE_TOKEN_FILE: /run/secrets/uiw-service-token
    volumes:
      - /data/agno/volumes/universal-import/source-objects:/data/uiw/source-objects
      - /data/agno/secrets/uiw/preview-cursor-key:/run/secrets/uiw-preview-cursor-key:ro
      - /data/agno/secrets/uiw/service-token:/run/secrets/uiw-service-token:ro
      - /data/agno/secrets/n8n/universal-import-auth:/run/secrets/n8n-universal-import-auth:ro
      - /data/agno/secrets/platform/database-url:/run/secrets/platform-database-url:ro
