# data-memgql — Memgraph Zero / MemGQL federated GQL engine (ADR-0041 Variant A, 2026-07-27)
# Byline: Claude Code · Fable 5 · 2026-07-27
# Multi-connection mode: backends (data-pg Postgres, Neo4j, DuckDB) are attached at
# runtime via GQL statements over Bolt :7688 — no mapping file needed to boot.
# Bolt port 7688 chosen to avoid Neo4j's 7687 on the same node.
services:
  memgql:
    image: memgraph/memgql:0.6.1
    ports:
      - "7688:7688"
    environment:
      CONNECTOR_TYPE: multi
      BOLT_LISTEN_ADDR: 0.0.0.0:7688
    restart: unless-stopped
