# =============================================================================
# EXEC TIER (RUMP) — deploy on OVH-1 ("ovh1-agno"; tailnet 100.72.169.40, salem
# private 10.1.1.122, public 40.160.5.19), the execution + surfaces box.
# Coolify "Docker Compose" app (rz41wqhpjfh1rj796ixvjhfs) built from this repo.
#
# 2026-07-19 SPLIT (owner order: "separate anything that can be separated"):
# gateway, sandbox, platform-tools, desktop, and contextforge were split out
# into their own one-service-per-app Coolify apps (compose.gateway.yaml,
# compose.sandbox.yaml, compose.platform-tools.yaml, compose.desktop.yaml,
# compose.contextforge.yaml — see exec-tier-split-result.md for the full
# before/after). agent-ui was REMOVED (not split) — the standalone `agent-ui`
# Coolify app (ee2vevjrutfzxlytlu081frh) already served chat.mitechconsult.com
# and was functionally redundant with this bundle's tailnet-only copy.
#
# This file now holds ONLY agentos-api + agentos-mcp — legitimately coupled
# (same image, one build) and left together per owner's explicit call.
# They reach contextforge/platform-tools over the shared external `agno`
# docker network (same docker-DNS names as before the split: `contextforge`,
# `platform-tools` — CF_GATEWAY_URL / SBV_BASE_URL values are UNCHANGED).
# =============================================================================
# Mirrors the proven milvus-coolify pattern:
#   * ports bind to ${BIND_IP} (the box's TAILNET IP) — NOT 0.0.0.0. Set
#     BIND_IP=100.72.169.40 in the Coolify app env (OVH-1 tailnet IP).
#
# Cross-box wiring: at the moment everything communicates through Tailscale, so
# cross-box addresses DEFAULT to the tailnet IP, with the salem private IP
# documented as the swap-later fast path. Set via env so switching is trivial:
#   OVH1_HOST   this exec box. Default 100.72.169.40 (tailnet); salem alt 10.1.1.122.
#   OVH3_HOST   data box (db + neo4j + graphiti + milvus + surrealdb).
#               Default 100.119.96.29 (tailnet); salem alt 10.1.2.101.
# plus DB_*, MILVUS_*, SURREALDB_*, CF_*, R2_*, OPENROUTER_API_KEY.
#
# HOST-PREP on OVH-1 BEFORE first deploy:
#   sudo mkdir -p /data/agno/volumes/{sbv_data,agent_workspace,kasm_profile,contextforge}
#   sudo chown -R 1000:1000 /data/agno/volumes/agent_workspace  # shared sandbox<->desktop
#   sudo chown -R 1000:1000 /data/agno/volumes/contextforge     # ContextForge SQLite db + state
# (r2-nexus stays a named volume — it uses the rclone driver, not a bind.)
# `docker network create agno` on OVH-1 if not already present (shared
# cross-app network — created 2026-07-19 for this split, mirrors OVH-3's
# `agno` net from the data-tier split, commit 18c42d2).
# =============================================================================

services:
  agentos-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentos-api
    image: ${IMAGE_NAME:-agentos}:${IMAGE_TAG:-latest}
    # Prod: run the baked image (no live .:/app source mount). Redeploy to ship
    # code changes. NO --reload (breaks the MCP lifespan under AgentOS).
    command: uvicorn server.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:8000:8000"   # main API/MCP surface — proxy-ready below
    volumes:
      # R2 bucket "nexus" via rclone docker volume plugin — stack-wide blob store.
      - r2-nexus:/r2
    env_file:
      - path: .env
        required: false
    environment:
      RUNTIME_ENV: ${RUNTIME_ENV:-dev}
      AGNO_DEBUG: "True"
      WAIT_FOR_DB: "True"
      AGENTOS_URL: http://127.0.0.1:8000
      # Data tier lives on OVH-3 — reach it by tailnet IP (default), not a docker
      # name. ${OVH3_HOST} default 100.119.96.29 (tailnet); salem alt 10.1.2.101.
      DB_HOST: ${OVH3_HOST}
      DB_PORT: 5432
      DB_USER: ${DB_USER:-ai}
      DB_PASS: ${DB_PASS:-ai}
      DB_DATABASE: ${DB_DATABASE:-ai}
      # Milvus (ADR-0026/0027) — vector store on OVH-3; defaults to the data box's
      # gRPC port over the tailnet. Override MILVUS_ADDRESS/TOKEN in env if needed.
      MILVUS_ADDRESS: ${MILVUS_ADDRESS:-http://${OVH3_HOST}:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      # SurrealDB (Agno operational store) on OVH-3 — WS transport, /rpc path.
      SURREALDB_URL: ${SURREALDB_URL:-ws://${OVH3_HOST}:8000/rpc}
      SURREALDB_USER: ${SURREALDB_USER:-root}
      SURREALDB_PASS: ${SURREALDB_PASS:-root}
      SURREALDB_NS: ${SURREALDB_NS:-agno}
      SURREALDB_DB: ${SURREALDB_DB:-platform}
      # Reach MCP servers ONLY through ContextForge, never graphiti's 8071 directly.
      # `contextforge` now resolves via the shared `agno` network (its own split
      # app, compose.contextforge.yaml) — value UNCHANGED from before the split.
      CF_GATEWAY_URL: http://contextforge:4444
      CF_GRAPHITI_SERVER_ID: ${CF_GRAPHITI_SERVER_ID:-} # virtual server UUID from POST /servers
      CF_GATEWAY_TOKEN: ${CF_GATEWAY_TOKEN:-}           # long-lived client JWT (mint w/ create_jwt_token)
      # Knowledge embedder via OpenRouter symmetric models (ADR-0027).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # R2 blob landing zone (ADR-0007) — S3-compatible reads via boto3/agno.
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      # SBV toolkit (facade-collapse plan Batch A, §2.3) — server/agents/tools/
      # sbv_tools.py talks to SBV directly over the shared `agno` network
      # (platform-tools:8085, now its own split app, compose.platform-tools.yaml),
      # not through the tools-facade proxy. Value UNCHANGED from before the split.
      SBV_BASE_URL: ${SBV_BASE_URL:-http://platform-tools:8085}
      SBV_SERVICE_USER: ${SBV_SERVICE_USER:-mcp_service}
      SBV_SERVICE_PASS: ${SBV_SERVICE_PASS:?set SBV_SERVICE_PASS in Coolify app env}
    # No depends_on agentos-db — it's on another box. WAIT_FOR_DB handles startup.
    # DOMAIN PHASE — main API. Re-enable + set API_DOMAIN to expose publicly:
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.agentos-api.rule=Host(`${API_DOMAIN}`)
    #   - traefik.http.routers.agentos-api.entryPoints=https
    #   - traefik.http.routers.agentos-api.tls=true
    #   - traefik.http.routers.agentos-api.tls.certresolver=letsencrypt
    #   - traefik.http.routers.agentos-api.service=agentos-api
    #   - traefik.http.services.agentos-api.loadbalancer.server.port=8000
    networks:
      - agentos
      - agno   # cross-app docker-DNS to contextforge / platform-tools (2026-07-19 split)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # agentos-mcp — the MCP server run STANDALONE (NOT mounted). FastMCP's
  # StreamableHTTP session-manager task group does not survive being a mounted
  # sub-app under uvicorn → mounted /mcp 500s "task group not initialized".
  # Served as its OWN ASGI app (server.api.mcp_main:mcp_app) its lifespan runs natively
  # and /mcp works (verified mounted=0/5 vs standalone=5/5). Same image as
  # agentos-api. Traefik routes Host(agentos.*) + PathPrefix(/mcp) HERE (higher
  # priority than the agentos-api catch-all), gated by basic auth (user matt).
  # ---------------------------------------------------------------------------
  agentos-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentos-mcp
    image: ${IMAGE_NAME:-agentos}:${IMAGE_TAG:-latest}
    command: uvicorn server.api.mcp_main:mcp_app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:8001:8001"   # MCP surface (tailnet); public via Traefik below
    volumes:
      - r2-nexus:/r2
    env_file:
      - path: .env
        required: false
    environment:
      RUNTIME_ENV: ${RUNTIME_ENV:-dev}
      AGNO_DEBUG: "True"
      WAIT_FOR_DB: "True"
      AGENTOS_URL: http://127.0.0.1:8000
      # fastmcp 3.x: settings.host defaults to 127.0.0.1 which AUTO-LOCKS the Host
      # allowlist to localhost -> CF's "Host: agentos-mcp:8001" got 421 (same upstream
      # bug as graphiti). FASTMCP_HOST=0.0.0.0 skips the auto-lock.
      FASTMCP_HOST: 0.0.0.0
      OS_SECURITY_KEY: ${OS_SECURITY_KEY:-}
      DB_HOST: ${OVH3_HOST}
      DB_PORT: 5432
      DB_USER: ${DB_USER:-ai}
      DB_PASS: ${DB_PASS:-ai}
      DB_DATABASE: ${DB_DATABASE:-ai}
      MILVUS_ADDRESS: ${MILVUS_ADDRESS:-http://${OVH3_HOST}:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      SURREALDB_URL: ${SURREALDB_URL:-ws://${OVH3_HOST}:8000/rpc}
      SURREALDB_USER: ${SURREALDB_USER:-root}
      SURREALDB_PASS: ${SURREALDB_PASS:-root}
      SURREALDB_NS: ${SURREALDB_NS:-agno}
      SURREALDB_DB: ${SURREALDB_DB:-platform}
      CF_GATEWAY_URL: http://contextforge:4444
      CF_GRAPHITI_SERVER_ID: ${CF_GRAPHITI_SERVER_ID:-}
      CF_GATEWAY_TOKEN: ${CF_GATEWAY_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      DEFAULT_MODEL_PROVIDER: ${DEFAULT_MODEL_PROVIDER:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      # SBV toolkit (facade-collapse plan Batch A, §2.3) — see agentos-api's
      # matching block above for the rationale; agentos-mcp needs the same
      # env because it's the process that actually serves sbv_tools.py's
      # @tool functions over MCP.
      SBV_BASE_URL: ${SBV_BASE_URL:-http://platform-tools:8085}
      SBV_SERVICE_USER: ${SBV_SERVICE_USER:-mcp_service}
      SBV_SERVICE_PASS: ${SBV_SERVICE_PASS:?set SBV_SERVICE_PASS in Coolify app env}
    labels:
      - traefik.enable=true
      - traefik.docker.network=rz41wqhpjfh1rj796ixvjhfs
      - traefik.http.routers.agentos-mcp.rule=Host(`agentos.mitechconsult.com`) && PathPrefix(`/mcp`)
      - traefik.http.routers.agentos-mcp.entryPoints=https
      - traefik.http.routers.agentos-mcp.tls=true
      - traefik.http.routers.agentos-mcp.tls.certresolver=letsencrypt
      - traefik.http.routers.agentos-mcp.priority=200
      - traefik.http.routers.agentos-mcp.service=agentos-mcp
      - traefik.http.routers.agentos-mcp.middlewares=mcp-auth
      - traefik.http.middlewares.mcp-auth.basicauth.users=matt:$apr1$baWBjon1$CeRCrbBEl/8SEglAHlfTu1
      - traefik.http.services.agentos-mcp.loadbalancer.server.port=8001
    networks:
      - agentos
      - agno   # cross-app docker-DNS to contextforge / platform-tools (2026-07-19 split)
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  agentos:
  agno:
    external: true   # shared cross-app network on OVH-1 (created 2026-07-19 split)

volumes:
  # Cloudflare R2 bucket "nexus" via the rclone volume plugin (host config:
  # /var/lib/docker-plugins/rclone/config/rclone.conf). Not a bind mount.
  r2-nexus:
    driver: rclone
    driver_opts:
      remote: "r2:nexus"
      allow_other: "true"
      vfs_cache_mode: "writes"

