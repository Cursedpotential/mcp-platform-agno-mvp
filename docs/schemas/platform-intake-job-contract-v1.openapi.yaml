openapi: 3.1.0
info:
  title: Platform Intake and Governed Preview Contract
  version: 1.0.0
  x-byline: Codex GPT-5.6-Sol 2026-08-30
  x-generated-from: workbench.api.main:app.openapi
  description: Generated bounded client contract for the implemented UIW source inspection, append-only source context, start,
    and preview routes. Regenerate instead of hand-copying browser or backend types.
paths:
  /api/uiw/source-inspection:
    post:
      tags:
      - uiw
      summary: Source Inspection Endpoint
      operationId: source_inspection_endpoint_api_uiw_source_inspection_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceInspectionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceInspectionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/uiw/source-contexts:
    post:
      tags:
      - uiw
      summary: Source Context Endpoint
      operationId: source_context_endpoint_api_uiw_source_contexts_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceContextCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceContextReceipt'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/uiw/start:
    post:
      tags:
      - uiw
      summary: Start Endpoint
      operationId: start_endpoint_api_uiw_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UIWStartRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UIWStartResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/uiw/previews/{preview_handle}:
    get:
      tags:
      - uiw
      summary: Preview Endpoint
      operationId: preview_endpoint_api_uiw_previews__preview_handle__get
      parameters:
      - name: preview_handle
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,128}$
          title: Preview Handle
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UIWPreviewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HumanSourceAssertions:
      properties:
        source_class:
          type: string
          enum:
          - first_party
          - acquired_third_party
          - unknown
          title: Source Class
          default: unknown
        source_principal:
          type: string
          maxLength: 4000
          title: Source Principal
          default: ''
        other_party:
          type: string
          maxLength: 4000
          title: Other Party
          default: ''
        acquired_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Acquired At
        acquisition_method:
          type: string
          enum:
          - ''
          - own_device
          - household_device
          - voluntary_third_party
          - legal_process
          - public_source
          - unknown
          title: Acquisition Method
          default: ''
        acquisition_authority:
          type: string
          enum:
          - ''
          - device_owner
          - parent_guardian
          - account_holder
          - consent_given
          - court_order
          - unclear
          title: Acquisition Authority
          default: ''
        source_device:
          type: string
          maxLength: 4000
          title: Source Device
          default: ''
        device_custodian:
          type: string
          maxLength: 4000
          title: Device Custodian
          default: ''
        occurred_start:
          type: string
          title: Occurred Start
          default: ''
        occurred_end:
          type: string
          title: Occurred End
          default: ''
        date_certainty:
          type: string
          enum:
          - ''
          - exact
          - approximate
          - range
          - unknown
          title: Date Certainty
          default: ''
        context:
          type: string
          maxLength: 4000
          title: Context
          default: ''
        notes:
          type: string
          maxLength: 4000
          title: Notes
          default: ''
      additionalProperties: false
      type: object
      title: HumanSourceAssertions
    ObservedSource:
      properties:
        key:
          type: string
          maxLength: 1024
          minLength: 1
          title: Key
        name:
          type: string
          maxLength: 1024
          minLength: 1
          title: Name
        byte_length:
          type: integer
          minimum: 0.0
          title: Byte Length
        etag:
          type: string
          maxLength: 1024
          minLength: 1
          title: Etag
        preview_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Preview Sha256
        verification_state:
          type: string
          const: preview_only
          title: Verification State
          default: preview_only
      additionalProperties: false
      type: object
      required:
      - key
      - name
      - byte_length
      - etag
      - preview_sha256
      title: ObservedSource
    ParserPreflight:
      properties:
        declared_format:
          type: string
          title: Declared Format
        route_label:
          type: string
          title: Route Label
        basis:
          type: string
          const: filename_extension
          title: Basis
          default: filename_extension
        authoritative:
          type: boolean
          const: false
          title: Authoritative
          default: false
      additionalProperties: false
      type: object
      required:
      - declared_format
      - route_label
      title: ParserPreflight
      description: Non-authoritative routing hint derived only from the source filename.
    SourceContextCreateRequest:
      properties:
        request_id:
          type: string
          maxLength: 1024
          minLength: 1
          title: Request Id
        matter_id:
          type: string
          format: uuid
          title: Matter Id
        court_case_id:
          type: string
          format: uuid
          title: Court Case Id
        source_ref:
          type: string
          maxLength: 1024
          minLength: 1
          title: Source Ref
        supersedes_ref:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Supersedes Ref
        observed_source:
          $ref: '#/components/schemas/ObservedSource'
        assertions:
          $ref: '#/components/schemas/HumanSourceAssertions'
        change_reason:
          type: string
          maxLength: 4000
          minLength: 1
          title: Change Reason
      additionalProperties: false
      type: object
      required:
      - request_id
      - matter_id
      - court_case_id
      - source_ref
      - observed_source
      - assertions
      - change_reason
      title: SourceContextCreateRequest
    SourceContextReceipt:
      properties:
        source_context_ref:
          type: string
          format: uuid
          title: Source Context Ref
        receipt_ref:
          type: string
          maxLength: 1024
          minLength: 1
          title: Receipt Ref
        content_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Content Digest
        revision:
          type: integer
          minimum: 1.0
          title: Revision
        recorded_at:
          type: string
          format: date-time
          title: Recorded At
      type: object
      required:
      - source_context_ref
      - receipt_ref
      - content_digest
      - revision
      - recorded_at
      title: SourceContextReceipt
    SourceInspectionRequest:
      properties:
        key:
          type: string
          maxLength: 1024
          minLength: 1
          title: Key
        expected_byte_length:
          type: integer
          minimum: 0.0
          title: Expected Byte Length
        expected_etag:
          anyOf:
          - type: string
            maxLength: 512
            minLength: 1
          - type: 'null'
          title: Expected Etag
      additionalProperties: false
      type: object
      required:
      - key
      - expected_byte_length
      title: SourceInspectionRequest
    SourceInspectionResponse:
      properties:
        source:
          type: string
          const: casebible-sorted
          title: Source
          default: casebible-sorted
        key:
          type: string
          maxLength: 1024
          minLength: 1
          title: Key
        source_ref:
          type: string
          title: Source Ref
        name:
          type: string
          title: Name
        byte_length:
          type: integer
          minimum: 0.0
          title: Byte Length
        etag:
          type: string
          maxLength: 512
          minLength: 1
          title: Etag
        last_modified:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Modified
        content_type:
          type: string
          title: Content Type
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
        digest_status:
          type: string
          const: preview_only
          title: Digest Status
          default: preview_only
        preview_kind:
          type: string
          enum:
          - pdf
          - text
          - image
          - unsupported
          title: Preview Kind
        preview_text:
          type: string
          title: Preview Text
          default: ''
        preview_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Preview Url
        parser_preflight:
          $ref: '#/components/schemas/ParserPreflight'
      additionalProperties: false
      type: object
      required:
      - key
      - source_ref
      - name
      - byte_length
      - etag
      - content_type
      - sha256
      - preview_kind
      - parser_preflight
      title: SourceInspectionResponse
    UIWParserIdentity:
      properties:
        parser_id:
          type: string
          minLength: 1
          title: Parser Id
        parser_version:
          type: string
          minLength: 1
          title: Parser Version
        config_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Config Digest
      type: object
      required:
      - parser_id
      - parser_version
      - config_digest
      title: UIWParserIdentity
    UIWPreviewCorrelation:
      properties:
        request_id:
          type: string
          minLength: 1
          title: Request Id
        source_version_id:
          type: string
          format: uuid
          title: Source Version Id
        raw_generation_id:
          type: string
          format: uuid
          title: Raw Generation Id
        normalized_generation_id:
          type: string
          format: uuid
          title: Normalized Generation Id
      type: object
      required:
      - request_id
      - source_version_id
      - raw_generation_id
      - normalized_generation_id
      title: UIWPreviewCorrelation
    UIWPreviewReceipt:
      properties:
        receipt_type:
          type: string
          enum:
          - custody
          - parser_selection
          - parser_execution
          - normalization
          - storage
          - completeness
          title: Receipt Type
        receipt_ref:
          type: string
          minLength: 1
          title: Receipt Ref
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - skipped
          title: Status
        digest:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
          title: Digest
        recorded_at:
          type: string
          format: date-time
          title: Recorded At
      type: object
      required:
      - receipt_type
      - receipt_ref
      - status
      - recorded_at
      title: UIWPreviewReceipt
      description: Reference-only receipt; raw or normalized payload bytes are forbidden here.
    UIWPreviewResponse:
      properties:
        preview_handle:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,128}$
          title: Preview Handle
        phase:
          type: string
          minLength: 1
          title: Phase
        correlation:
          anyOf:
          - $ref: '#/components/schemas/UIWPreviewCorrelation'
          - type: 'null'
        parser:
          anyOf:
          - $ref: '#/components/schemas/UIWParserIdentity'
          - type: 'null'
        preview_digest:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
          title: Preview Digest
        receipts:
          anyOf:
          - items:
              $ref: '#/components/schemas/UIWPreviewReceipt'
            type: array
            maxItems: 64
          - type: 'null'
          title: Receipts
        reason:
          type: string
          maxLength: 4000
          title: Reason
          default: ''
        repair_assessment:
          anyOf:
          - $ref: '#/components/schemas/UIWRepairAssessmentView'
          - type: 'null'
      type: object
      required:
      - preview_handle
      - phase
      title: UIWPreviewResponse
    UIWRepairAssessmentView:
      properties:
        assessment_ref:
          type: string
          maxLength: 512
          minLength: 1
          title: Assessment Ref
        source_version_ref:
          type: string
          maxLength: 512
          minLength: 1
          title: Source Version Ref
        review_required:
          type: boolean
          title: Review Required
      type: object
      required:
      - assessment_ref
      - source_version_ref
      - review_required
      title: UIWRepairAssessmentView
    UIWStartRequest:
      properties:
        request_id:
          type: string
          minLength: 1
          title: Request Id
        matter_id:
          type: string
          format: uuid
          title: Matter Id
        court_case_id:
          type: string
          format: uuid
          title: Court Case Id
        source_ref:
          type: string
          minLength: 1
          title: Source Ref
        declared_format:
          type: string
          minLength: 1
          title: Declared Format
        parser_options_ref:
          type: string
          minLength: 1
          title: Parser Options Ref
        source_context_ref:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Source Context Ref
      additionalProperties: false
      type: object
      required:
      - request_id
      - matter_id
      - court_case_id
      - source_ref
      - declared_format
      - parser_options_ref
      title: UIWStartRequest
    UIWStartResponse:
      properties:
        preview_handle:
          type: string
          pattern: ^[A-Za-z0-9_-]{32,128}$
          title: Preview Handle
      type: object
      required:
      - preview_handle
      title: UIWStartResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
