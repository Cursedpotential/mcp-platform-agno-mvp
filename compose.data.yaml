# =============================================================================
# DATA TIER — deploy on OVH-3 ("ovh3-data"; tailnet 100.119.96.29, salem private
# 10.1.2.101, public 147.135.79.183), the data box. Coolify "Docker Compose" app
# built from this repo. Counterpart: compose.exec.yaml on OVH-1 ("ovh1-agno").
# Hosts: agentos-db (PG18), neo4j, graphiti-mcp, Milvus (relocated here from the
# decommissioned OVH-2), SurrealDB.  (Platform re-deploy, Phase B/C.)
# =============================================================================
# Mirrors the proven milvus-coolify pattern:
#   * ports bind to ${BIND_IP} (the box's TAILNET IP) — NOT 0.0.0.0 — so nothing
#     is published on the public interface. Set BIND_IP=100.119.96.29 in the
#     Coolify app env (OVH-3 tailnet IP). Default 127.0.0.1 = safe/loopback.
#   * Traefik labels for HTTP surfaces are scaffolded but COMMENTED OUT ("DOMAIN
#     PHASE") — flip on + set the *_DOMAIN env when DNS/TLS is wanted.
#   * absolute bind volumes + absolute config/SQL FILE mounts (Coolify gotchas #4/#5).
#
# Cross-box wiring: at the moment everything communicates through Tailscale, so
# cross-box addresses DEFAULT to the tailnet IP, with the salem private IP
# documented as the swap-later fast path. Set via env so switching is trivial:
#   OVH1_HOST   exec box (graphiti-mcp -> gateway). Default 100.72.169.40 (tailnet);
#               salem alt 10.1.1.122.
#   OVH3_HOST   this data box. Default 100.119.96.29 (tailnet); salem alt 10.1.2.101.
#
# HOST-PREP on OVH-3 BEFORE first deploy:
#   sudo mkdir -p /data/agno/volumes/{pgdata,neo4j_data,milvus,surrealdb} \
#                 /data/agno/config/{sql,graphiti,milvus}
#   sudo chown -R 999:999   /data/agno/volumes/pgdata       # postgres uid
#   sudo chown -R 7474:7474 /data/agno/volumes/neo4j_data   # neo4j uid
#   sudo chown -R 999:999   /data/agno/volumes/milvus       # milvus uid
#   sudo chown -R 0:0       /data/agno/volumes/surrealdb    # surrealdb runs as root
#   # stage the real config/SQL files at the absolute paths the binds point to:
#   #   scp sql/000*.sql                ovh3:/data/agno/config/sql/
#   #   scp docker/graphiti/config.yaml ovh3:/data/agno/config/graphiti/
#   #   scp configs/embedEtcd.yaml configs/user.yaml ovh3:/data/agno/config/milvus/
# =============================================================================

services:
  agentos-db:
    # Custom PG18: pg_duckdb + PostGIS + pgvector + pg_stat_statements.
    build:
      context: ./docker/postgres
    image: agno-postgres:18-duckdb
    container_name: agentos-db
    restart: unless-stopped
    ports:
      # raw TCP, tailnet-only (reached by agentos-api on OVH-1); never proxied
      - "${BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - /data/agno/volumes/pgdata:/var/lib/postgresql
      # init SQL — ABSOLUTE host binds (gotcha #5); run once on an EMPTY data dir
      - /data/agno/config/sql/0001_init_extensions.sql:/docker-entrypoint-initdb.d/01_extensions.sql:ro
      - /data/agno/config/sql/0002_schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
      - /data/agno/config/sql/0003_normalized_records.sql:/docker-entrypoint-initdb.d/03_normalized_records.sql:ro
    environment:
      POSTGRES_USER: ${DB_USER:-ai}
      POSTGRES_PASSWORD: ${DB_PASS:-ai}
      POSTGRES_DB: ${DB_DATABASE:-ai}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agentos

  # ---------------------------------------------------------------------------
  # Temporal graph memory (ADR-0014): Neo4j + Graphiti MCP. Co-located here
  # because the chatty edge is graphiti<->neo4j (every graph op); graphiti
  # reaches the LiteLLM gateway on OVH-1 over the tailnet for LLM/embeddings.
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    platform: linux/amd64
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:7474:7474"   # Browser (HTTP) — optionally proxied below
      - "${BIND_IP:-127.0.0.1}:7687:7687"   # bolt (raw TCP) — tailnet-only, never proxied
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-graphiti-dev-password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - /data/agno/volumes/neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    # DOMAIN PHASE — Neo4j Browser (admin). Re-enable + set NEO4J_DOMAIN to expose:
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.neo4j.rule=Host(`${NEO4J_DOMAIN}`)
    #   - traefik.http.routers.neo4j.entryPoints=https
    #   - traefik.http.routers.neo4j.tls=true
    #   - traefik.http.routers.neo4j.tls.certresolver=letsencrypt
    #   - traefik.http.routers.neo4j.service=neo4j
    #   - traefik.http.services.neo4j.loadbalancer.server.port=7474
    networks:
      - agentos

  graphiti-mcp:
    image: zepai/knowledge-graph-mcp:latest
    platform: linux/amd64
    container_name: graphiti-mcp
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:8071:8000"   # MCP — tailnet/internal ONLY; external access only via ContextForge, never direct
    environment:
      CONFIG_PATH: /app/mcp/config/config.yaml
      BROWSER: "0"
      NEO4J_URI: bolt://neo4j:7687     # same box — docker network name
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphiti-dev-password}
      # LLM + embeddings via the LiteLLM gateway on OVH-1, over the tailnet.
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-changeme-dev-key}
      OPENAI_API_URL: http://${OVH1_HOST}:4000/v1
      OPENAI_BASE_URL: http://${OVH1_HOST}:4000/v1
    volumes:
      # ABSOLUTE host bind (gotcha #5) — staged at /data/agno/config/graphiti/
      - /data/agno/config/graphiti/config.yaml:/app/mcp/config/config.yaml:ro
    depends_on:
      neo4j:
        condition: service_healthy
    # MCP SERVER — NO direct external access, ever. Internal/tailnet-only now
    # (reached by agentos-api + n8n over the tailnet). When external access is
    # required, it routes through the IBM ContextForge MCP gateway (ADR-0025,
    # Phase D) — NEVER a direct Traefik route. Deliberately NO proxy labels.
    networks:
      - agentos

  # ---------------------------------------------------------------------------
  # SurrealDB — the Agno OPERATIONAL store (sessions/memory/metrics/eval/
  # knowledge-content/culture/traces/spans). Persistent rocksdb on an absolute
  # host bind. Reached by agentos-api on OVH-1 over the tailnet/salem link.
  # WS transport on /rpc; raw TCP, tailnet-only — NEVER proxied, NEVER 0.0.0.0.
  # ---------------------------------------------------------------------------
  surrealdb:
    image: surrealdb/surrealdb:v3.1.4
    platform: linux/amd64
    container_name: surrealdb
    restart: unless-stopped
    user: "0:0"                      # official image is root; matches volume chown
    command:
      - start
      - --bind=0.0.0.0:8000          # in-container bind; host exposure gated by ports below
      - --user=${SURREALDB_USER:-root}
      - --pass=${SURREALDB_PASS:-root}
      - rocksdb:/data/surreal.db     # persistent file engine inside the bind mount
    ports:
      # raw TCP, tailnet-only (reached by agentos-api on OVH-1 over salem); never proxied
      - "${BIND_IP:-127.0.0.1}:8000:8000"
    volumes:
      - /data/agno/volumes/surrealdb:/data
    healthcheck:
      # The minimal SurrealDB image ships NO sh/curl, so the old CMD-SHELL curl
      # check always failed (-> Docker "unhealthy" while the DB served 200 fine).
      # Use the bundled `surreal isready` binary instead (verified exit 0 in-container).
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # DOMAIN PHASE — SurrealDB has NO admin UI worth exposing; keep tailnet-only.
    # Deliberately NO Traefik labels (raw TCP / internal service, like neo4j bolt).
    networks:
      - agentos

networks:
  agentos:

# No named volumes — data tier uses absolute host binds (declared inline above).
