# Byline: Codex · GPT-5 · 2026-08-13 (reproducible CI toolchain and optional-import typing)
[project]
name = "agent-platform"
version = "1.0.0"
description = "Agent platform with Postgres and AgentOS."
requires-python = ">=3.12,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  "agno[os,slack]",
  "surrealdb>=1.0.4,<2",
  "fastapi[standard]",
  "mcp",
  # fastmcp is required by agno's AgentOS.get_app() whenever mcp_server=True
  # (server/api/main.py), but NOTHING declares it — not agno[os], not mcp. In
  # the live image `pip show fastmcp` reports an EMPTY Required-by. It got in
  # once and was never captured, and because deploys run
  # `uv pip sync requirements.txt --system` (which removes anything unlisted),
  # the next clean rebuild would have swept it out and crash-looped the API on
  # ImportError: 'fastmcp' not installed. Declaring it here is the real fix:
  # a linux-target recompile still does NOT pick it up (verified 2026-08-02),
  # so a requirements.txt pin alone would be lost on the next regeneration.
  "fastmcp>=3,<4",
  "openai",
  # agno 2.8.0 stopped bundling per-provider model SDKs as transitive deps
  # (they were transitive under 2.6.13, satisfied implicitly). server/core/
  # settings.py's provider-priority chain (ADR-0008) imports agno.models.*
  # for all four directly, so they must be explicit here now.
  "ollama",
  "anthropic",
  "groq",
  "google-genai",
  "parallel-web",
  "pgvector",
  "weaviate-client",
  "psycopg[binary]",
  "sqlalchemy",
  # --- streaming repair layer (server/tools/repair/) ---
  # Every one of these is imported LAZILY, inside a function, never at module
  # import time. `registry.load_builtin_tools()` walks server/tools/ recursively
  # and imports every non-underscore module, and that same tree is volume-mounted
  # into the dep-light docker/tools facade — a module-level `import lxml` there
  # would FATAL-loop the facade exactly the way ADR-0033 already paid for once.
  # server/tools/repair/engines/__init__.py::available() reports which of these
  # actually resolved, so a missing one degrades instead of crashing.
  "lxml>=5",               # libxml2 recover=True: the ONLY XML repair that streams
  "ijson>=3.2",            # streaming JSON item iteration (no whole-doc load)
  "json-repair>=0.30,<1",  # semver: pin the major only (upstream ships frequent minors)
  "clevercsv>=0.8",        # dialect detection for messy CSV
  # charset-normalizer was present only TRANSITIVELY (via requests). The repair
  # layer depends on it directly for streaming encoding detection, so it is
  # declared here rather than relying on someone else's dependency tree.
  "charset-normalizer>=3",
  # pikepdf bundles libqpdf in its wheels, so structural PDF repair needs NO
  # system package. QPDF rebuilds a damaged cross-reference table by scanning
  # the file for object markers, which recovers PDFs that no reader will open.
  # This is REPAIR (make the file parseable); extract_text.py is EXTRACTION
  # (read text from a file that already parses). Different problems, both here.
  "pikepdf>=9",
  # native PDF text tiers used by server/tools/extractors/extract_text.py.
  # OCR (pytesseract + pdf2image) is deliberately NOT here: it needs the system
  # `tesseract-ocr` and `poppler` binaries, so it lives in the `ocr` extra.
  "pypdf>=5",
  "pdfplumber>=0.11",
  # beautifulsoup4 was dev-ONLY until 2026-08-02, but parsers/messaging/
  # facebook_messenger_html.py and imessage_html.py import it at RUNTIME. Any
  # prod ingest touching an HTML export would have raised ImportError. It is a
  # runtime dependency of shipped parsers, so it belongs in base.
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["mypy==2.1.0", "ruff==0.15.17", "pytest>=8,<9", "pytest-cov>=5,<8"]
# OCR tier. Both wheels are useless without system binaries — `tesseract-ocr`
# for pytesseract and `poppler` for pdf2image — so this stays opt-in and the
# container image must install those alongside it.
ocr = ["pytesseract", "pdf2image", "pillow"]
# Structured document/OCR tier for the standalone ingestion worker. Kept out
# of the parser facade's base environment because Docling brings local models
# and document-AI dependencies; install on the VPS worker or Colab backup.
document-ai = ["docling>=2.119,<3"]
# Optional transcript segmentation challengers. The default message-window
# chunker needs neither this extra nor a GPU; semantic uses the CPU-friendly
# Chonkie path and TeraflopAI calls its hosted segmentation API.
chunking = ["chonkie[semantic]>=1.7,<2"]
# claude-agent-sdk: powers agno.agents.claude.ClaudeAgent (runs Claude Code as
# a subprocess — the SDK bundles its own native Claude Code binary, no
# separate Node.js/CLI install needed). NOT a base dependency: it's a heavier
# install than the chat-completion path (agno.models.anthropic.Claude, which
# only needs the `anthropic` package already in base deps) and is opt-in
# pending owner sign-off on actually mounting server/agents/claude_code_agent.py
# into the live Root Router topology (server/agents/factory.py). See that
# module's docstring for the concrete wiring plan. Install with:
#   uv pip install -e ".[claude-code]"
claude-code = ["claude-agent-sdk"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*", "evals*"]

[tool.ruff]
line-length = 120
# docs/ holds vendored third-party code (cookbook notebooks); server/vendored/
# holds vendored third-party projects (chatminer, semantica) — not ours to
# format or lint.
exclude = [".venv*", "docs", "server/vendored"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*", "docs", "docker", "server/vendored"]
# scripts/ holds standalone scripts with no __init__.py; without this mypy maps
# e.g. ingest_knowledge.py to both "ingest_knowledge" and "scripts.ingest_knowledge"
# and errors with "Source file found twice under different module names".
explicit_package_bases = true

[[tool.mypy.overrides]]
# Third-party modules without type stubs / py.typed (incl. optional, heavy ML
# deps that aren't installed in CI and are lazy-imported in the segmenters).
module = [
  "pgvector.*",
  "weaviate.*",
  "agno.*",
  "httpx.*",
  "mcp.*",
  "sqlalchemy.*",
  "fastapi.*",
  "google.*",
  "sentence_transformers.*",
  "torch.*",
  "sklearn.*",
  "yaml",
  # optional OCR / HTML-parsing deps used by the forensic evidence tools
  "pypdf.*",
  "pdfplumber.*",
  "pytesseract.*",
  "pdf2image.*",
  "PIL.*",
  "bs4.*",
  # streaming repair layer (server/tools/repair/). All lazy-imported inside
  # functions, so mypy sees them but the dep-light tools facade never does.
  # lxml ships no py.typed (lxml-stubs is a separate, partial package); the
  # rest are untyped upstream.
  "lxml.*",
  "ijson.*",
  "clevercsv.*",
  "json_repair.*",
  "pikepdf.*",
  "charset_normalizer.*",
  # optional ingestion/agent extras; imports are lazy and availability-gated
  "chonkie.*",
  "claude_agent_sdk.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the first-party suite isolated from vendored third-party projects.
# server/vendored/semantica's test suite pulls heavy ML deps (torch, spacy,
# transformers) even in its "safe default" install and is NOT collected by
# default — run it opt-in, explicitly, after installing its extras:
#   uv pip install -e "server/vendored/semantica[dev]"
#   uv run pytest server/vendored/semantica/tests
norecursedirs = ["docs", ".venv*", "server/tools", "server/vendored"]
# Integration tests are opt-in: run them with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
  "integration: tests that require live services (Postgres/Neo4j/R2); not run by default",
]

[tool.uv.pip]
no-annotate = true
