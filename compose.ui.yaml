# =============================================================================
# UI TIER — agno agent-ui (self-hosted chat/control surface) on OVH-1.
# Deployed as its OWN Coolify "Docker Compose" app (separate from exec-tier) so
# its heavy Next.js build can never break the platform deploy — that build is why
# the service was pulled from compose.exec.yaml. Public face: chat.mitechconsult.com.
#
# The UI runs entirely in the browser and talks DIRECTLY to the AgentOS API at
# https://agentos.mitechconsult.com — it holds NO secrets and NO DB. The user sets
# the endpoint URL + Auth Token (the platform OS_SECURITY_KEY) in the UI sidebar;
# both are stored client-side in the browser, never baked into this image. The
# platform's CORS allows https://chat.mitechconsult.com (app/main.py).
#
# Single service on Coolify's managed proxy network (no custom network, no extra
# published port) so Traefik routes Host(chat.*) -> :3000 without ambiguity. The
# OVH-1 4GB swapfile + NODE_OPTIONS heap cap (docker/agent-ui/Dockerfile) keep the
# `next build` from OOM-killing.
# =============================================================================

services:
  agent-ui:
    build:
      context: ./docker/agent-ui
    image: agno-agent-ui:latest
    container_name: agent-ui
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    labels:
      - traefik.enable=true
      - traefik.http.routers.agent-ui.rule=Host(`chat.mitechconsult.com`)
      - traefik.http.routers.agent-ui.entryPoints=https
      - traefik.http.routers.agent-ui.tls=true
      - traefik.http.routers.agent-ui.tls.certresolver=letsencrypt
      - traefik.http.routers.agent-ui.service=agent-ui
      - traefik.http.services.agent-ui.loadbalancer.server.port=3000

