# NocoDB — owner planning/notes/tables front-end + Case Bible review UI (ADR-0029)
# _Byline: Claude Code · Fable 5 · 2026-07-12_
# Host: ovh-data. Tailnet-only bind (BIND_IP). Bind-mount volume per owner rule (no named volumes).
# Metadata store = SQLite on the bind mount; casebible PG attaches later as an EXTERNAL data source
# in the NocoDB UI (reachable as agno-pg via the shared `agno` docker network).
services:
  nocodb:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    ports:
      - "${BIND_IP}:8570:8080"
    environment:
      - NC_PUBLIC_URL=${NC_PUBLIC_URL}
      - NC_DISABLE_TELE=true
    volumes:
      - /data/agno/volumes/nocodb:/usr/app/data
    networks:
      - agno
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  agno:
    external: true
